# DungeonCrusher Multi-Agent System Configuration

# Game window settings
game:
  window_title: "VK Play"
  # Fallback window search keywords
  window_keywords:
    - "Dungeon"
    - "Crusher"
    - "Soul Hunters"

# Screen capture settings
capture:
  # Target FPS for screen capture loop
  target_fps: 10
  # Monitor index (0 = primary)
  monitor: 0

# Input settings
input:
  # Delay between actions in seconds
  action_delay: 0.05
  # Double-click threshold in seconds
  double_click_interval: 0.3

# Vision settings
vision:
  # Template matching confidence threshold (0.0 - 1.0)
  match_confidence: 0.8
  # OCR language
  ocr_lang: "eng"

# Agent settings
agents:
  # Max number of concurrent child agents
  max_children: 8
  # Child agent decision timeout in seconds
  decision_timeout: 1.0

# Tooltip Reader Agent (CTRL+H OCR tool)
tooltip_reader:
  # Size of the capture region around the cursor (pixels)
  region_width: 320
  region_height: 90
  # Reserved for future auto-hover mode
  hover_delay: 0.0
  # Tesseract language code (eng, rus, eng+rus)
  ocr_lang: "eng"
  # Upscale factor for OCR (1.0 = no scaling, 2.0 = double size)
  scale: 2.0
  # Invert colors for light-on-dark tooltips
  invert: true

# Web Review Interface (manual review before saving)
web_review:
  host: "127.0.0.1"
  port: 8765
  db_path: "resources/ui_elements_db.json"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/system.log"
